<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BetPredictor · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0c1018; --panel:#151b27; --panel2:#1c2433; --line:#2a3445;
    --txt:#e6ecf5; --mut:#8a97ad; --acc:#4f9cf9; --acc2:#27c499;
    --warn:#f5a623; --bad:#ef5b6b; --good:#27c499;
    --chip:#223049;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt)}
  a{color:var(--acc);text-decoration:none;cursor:pointer}
  a:hover{text-decoration:underline}
  #app{display:flex;min-height:100vh}
  /* sidebar */
  #side{width:230px;background:var(--panel);border-right:1px solid var(--line);
        position:fixed;top:0;bottom:0;display:flex;flex-direction:column;overflow:auto}
  #side .brand{padding:18px 18px 10px;font-weight:700;font-size:18px;letter-spacing:.3px}
  #side .brand small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:3px}
  #side nav{padding:8px}
  #side .grp{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:14px 12px 4px}
  #side a.nav{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;color:var(--txt);font-weight:500}
  #side a.nav:hover{background:var(--panel2);text-decoration:none}
  #side a.nav.active{background:var(--acc);color:#06223f}
  #side a.nav .ic{width:18px;text-align:center;opacity:.9}
  #side .dbstat{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
  .dot.ok{background:var(--good)}
  /* main */
  #main{margin-left:230px;flex:1;padding:24px 30px;max-width:1500px}
  h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:26px 0 12px}
  .sub{color:var(--mut);margin:0 0 18px}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:26px;font-weight:700;margin-top:6px}
  .card .v small{font-size:13px;color:var(--mut);font-weight:500}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
  @media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
     position:sticky;top:0;background:var(--panel);cursor:pointer}
  tbody tr:hover{background:var(--panel2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl-wrap{max-height:70vh;overflow:auto;border-radius:10px}
  /* controls */
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
               padding:8px 10px;border-radius:8px;font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;
       border-radius:8px;cursor:pointer;font:inherit}
  .btn:hover{border-color:var(--acc)} .btn.pri{background:var(--acc);color:#06223f;border-color:var(--acc);font-weight:600}
  .chip{display:inline-block;background:var(--chip);padding:2px 9px;border-radius:20px;font-size:11px;color:var(--mut)}
  .pill{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .pill.home{background:#1d3a5f;color:#9cc8ff}.pill.away{background:#3a2030;color:#ff9cb0}
  .pill.draw{background:#2c2f3a;color:#c3c9d6}
  .bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px}
  .bar>span{display:block;height:100%;background:var(--acc)}
  .muted{color:var(--mut)}
  .right{text-align:right}
  .loading{color:var(--mut);padding:30px;text-align:center}
  .err{color:var(--bad);padding:14px;background:#2a1820;border-radius:8px;border:1px solid #4a2530}
  canvas{max-height:300px}
  .markdown{line-height:1.6} .markdown h1,.markdown h2,.markdown h3{margin:18px 0 8px}
  .markdown code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
  .markdown ul{padding-left:20px}
  iframe.graph{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .kv .k{color:var(--mut)}
  .tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--mut);margin-left:6px}
  .scorebox{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .clickable{cursor:pointer}
  details summary{cursor:pointer;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="brand">⚽ BetPredictor<small>local model dashboard</small></div>
    <nav id="nav"></nav>
    <div class="dbstat" id="dbstat"><span class="dot" id="dbdot"></span>connecting…</div>
  </div>
  <div id="main"><div class="loading">Loading…</div></div>
</div>

<script>
const API = (p, params) => {
  const u = new URL(p, location.origin);
  if(params) Object.entries(params).forEach(([k,v])=>{ if(v!=null && v!=='') u.searchParams.set(k,v); });
  return fetch(u).then(r=>r.json());
};
const $ = (s,el=document)=>el.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const fmt = (x,d=2)=> x==null?'<span class="muted">–</span>':(typeof x==='number'?x.toFixed(d):x);
const pct = (x)=> x==null?'<span class="muted">–</span>':(100*x).toFixed(1)+'%';
const esc = (s)=> (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dt  = (s)=> s? new Date(s).toLocaleString(undefined,{year:'2-digit',month:'short',day:'numeric'}):'';

const NAV = [
  ['Analyse',[
    ['overview','Overview','📊'],
    ['matches','Matches','🗓️'],
    ['teams','Teams','🛡️'],
    ['players','Players','👤'],
  ]],
  ['Model',[
    ['upcoming','Upcoming & EV','📅'],
    ['predictions','Predictions','🎯'],
    ['value','Value Finder','💰'],
    ['props','Player Props','🥅'],
    ['simulations','Sim & Runs','🎲'],
    ['models','Model Registry','🧠'],
  ]],
  ['Knowledge',[
    ['graph','Knowledge Graph','🕸️'],
  ]],
];

function renderNav(){
  const n = $('#nav'); n.innerHTML='';
  NAV.forEach(([grp,items])=>{
    n.appendChild(el(`<div class="grp">${grp}</div>`));
    items.forEach(([id,label,ic])=>{
      const a = el(`<a class="nav" data-v="${id}"><span class="ic">${ic}</span>${label}</a>`);
      a.onclick=()=>go(id);
      n.appendChild(a);
    });
  });
}
function setActive(v){ document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v.split('/')[0])); }

// ---- router ----
const ROUTES = {};
function go(route){ location.hash = '#'+route; }
async function route(){
  const hash = location.hash.slice(1) || 'overview';
  const [view,...rest] = hash.split('/');
  setActive(view);
  const main = $('#main');
  main.innerHTML = '<div class="loading">Loading…</div>';
  const fn = ROUTES[view] || ROUTES.overview;
  try{ await fn(main, rest); }
  catch(e){ main.innerHTML = `<div class="err">Error: ${esc(e.message)}<br><small>${esc(e.stack||'')}</small></div>`; }
}
window.addEventListener('hashchange', route);

// generic sortable table
function table(rows, cols){
  if(!rows || !rows.length) return '<p class="muted">No rows.</p>';
  const head = cols.map(c=>`<th class="${c.num?'num':''}" data-k="${c.k}">${c.h}</th>`).join('');
  const body = rows.map(r=>'<tr>'+cols.map(c=>{
    const v = c.render? c.render(r[c.k],r): (c.num?fmt(r[c.k],c.d??2):esc(r[c.k]));
    return `<td class="${c.num?'num':''}">${v==null?'':v}</td>`;
  }).join('')+'</tr>').join('');
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

let charts=[];
function chart(canvas,cfg){ charts.push(new Chart(canvas,cfg)); }
function killCharts(){ charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[]; }

const GRID = {grid:{color:'#222b3a'},ticks:{color:'#8a97ad'}};
const CO = {responsive:true,plugins:{legend:{labels:{color:'#e6ecf5'}}},scales:{x:GRID,y:GRID}};

// =====================================================================
// OVERVIEW
// =====================================================================
ROUTES.overview = async (main)=>{
  killCharts();
  const d = await API('/api/overview');
  const c = d.counts;
  main.innerHTML = `
    <h1>Overview</h1>
    <p class="sub">EPL betting model · data ${dt(d.range.first_match)} → ${dt(d.range.last_match)} · default run #${d.default_run}</p>
    <div class="cards" id="kpis"></div>
    <div class="grid2">
      <div class="panel"><h2 style="margin-top:0">Matches & goals per season</h2><canvas id="cSeason"></canvas></div>
      <div class="panel"><h2 style="margin-top:0">Goals-per-match distribution</h2><canvas id="cGoals"></canvas></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2 style="margin-top:0">Result split</h2><canvas id="cRes"></canvas></div>
      <div class="panel"><h2 style="margin-top:0">Recent model runs</h2><div id="runs"></div></div>
    </div>`;
  const kpi=(k,v,s='')=>`<div class="card"><div class="k">${k}</div><div class="v">${v} <small>${s}</small></div></div>`;
  $('#kpis').innerHTML = [
    kpi('Matches', c.matches.toLocaleString(), `${c.played} played`),
    kpi('Teams', c.teams), kpi('Players', c.players.toLocaleString()),
    kpi('Team features', c.team_features.toLocaleString()),
    kpi('Prob. runs', c.prob_runs),
    kpi('Probabilities', (c.probabilities/1e6).toFixed(1)+'M'),
    kpi('Sim runs', c.sim_runs),
    kpi('Player props', (c.player_props/1e6).toFixed(2)+'M'),
  ].join('');
  chart($('#cSeason'),{type:'bar',data:{labels:d.by_season.map(r=>r.season_year),
    datasets:[{label:'matches',data:d.by_season.map(r=>r.matches),backgroundColor:'#4f9cf9'},
      {label:'avg goals',type:'line',yAxisID:'y2',data:d.by_season.map(r=>r.avg_goals),borderColor:'#27c499',backgroundColor:'#27c499'}]},
    options:{...CO,scales:{x:GRID,y:GRID,y2:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#27c499'}}}}});
  chart($('#cGoals'),{type:'bar',data:{labels:d.goals.map(r=>r.total_goals),
    datasets:[{label:'matches',data:d.goals.map(r=>r.n),backgroundColor:'#4f9cf9'}]},options:CO});
  chart($('#cRes'),{type:'doughnut',data:{labels:d.results.map(r=>r.result),
    datasets:[{data:d.results.map(r=>r.n),backgroundColor:['#4f9cf9','#27c499','#ef5b6b']}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#e6ecf5'}}}}});
  $('#runs').innerHTML = table(d.recent_runs,[
    {k:'id',h:'#',num:true,d:0},{k:'mode',h:'Mode',render:v=>`<span class="chip">${esc(v)}</span>`},
    {k:'validation_season',h:'Val season'},{k:'created_at',h:'Created',render:v=>dt(v)}]);
};

// =====================================================================
// MATCHES
// =====================================================================
let mState={season:'',team:'',q:'',offset:0};
ROUTES.matches = async (main)=>{
  main.innerHTML = `
    <h1>Matches</h1><p class="sub">Browse all fixtures. Click a row to open the match analysis.</p>
    <div class="toolbar">
      <input id="mq" placeholder="Search team…" value="${esc(mState.q)}" style="min-width:220px"/>
      <select id="mseason"></select>
      <button class="btn pri" id="mgo">Search</button>
      <span class="muted" id="mcount"></span>
    </div>
    <div id="mtbl"><div class="loading">Loading…</div></div>
    <div class="toolbar" style="justify-content:center"><button class="btn" id="mprev">← Prev</button><button class="btn" id="mnext">Next →</button></div>`;
  const seasons = (await API('/api/overview')).by_season.map(r=>r.season_year);
  $('#mseason').innerHTML = `<option value="">All seasons</option>`+seasons.map(s=>`<option ${s===mState.season?'selected':''}>${s}</option>`).join('');
  const load = async()=>{
    $('#mtbl').innerHTML='<div class="loading">Loading…</div>';
    const d = await API('/api/matches',{season:mState.season,q:mState.q,limit:100,offset:mState.offset});
    $('#mcount').textContent = `${d.total.toLocaleString()} matches`;
    $('#mtbl').innerHTML = table(d.rows,[
      {k:'start_datetime',h:'Date',render:v=>dt(v)},
      {k:'season_year',h:'Season'},
      {k:'home',h:'Home',render:(v,r)=>`<a onclick="go('match/${r.id}')">${esc(v)}</a>`},
      {k:'score',h:'',render:(_,r)=> r.home_score!=null?`<b>${r.home_score}–${r.away_score}</b>`:'<span class="muted">–</span>'},
      {k:'away',h:'Away',render:(v,r)=>`<a onclick="go('match/${r.id}')">${esc(v)}</a>`},
      {k:'id',h:'',render:(v)=>`<a onclick="go('match/${v}')">open →</a>`},
    ]);
  };
  $('#mgo').onclick=()=>{mState.q=$('#mq').value;mState.season=$('#mseason').value;mState.offset=0;load();};
  $('#mq').onkeydown=(e)=>{if(e.key==='Enter')$('#mgo').click();};
  $('#mprev').onclick=()=>{mState.offset=Math.max(0,mState.offset-100);load();};
  $('#mnext').onclick=()=>{mState.offset+=100;load();};
  load();
};

// =====================================================================
// MATCH DETAIL
// =====================================================================
ROUTES.match = async (main,[id])=>{
  killCharts();
  const d = await API('/api/match',{id});
  const m = d.match;
  if(!m){ main.innerHTML='<div class="err">Match not found.</div>'; return; }
  const probMap={}; d.probabilities.forEach(p=>{probMap[p.market_key]=probMap[p.market_key]||[];probMap[p.market_key].push(p);});
  const simMap={}; d.simulations.forEach(p=>{const k=p.market_key+'|'+p.selection+'|'+(p.line??'');simMap[k]=p.simulated_probability;});

  const oneX2 = (probMap['1x2']||[]);
  const order = {home:0,draw:1,away:2};
  oneX2.sort((a,b)=>order[a.selection]-order[b.selection]);

  main.innerHTML = `
    <a onclick="history.back()" class="muted">← back</a>
    <h1 style="margin-top:8px">${esc(m.home)} vs ${esc(m.away)}</h1>
    <p class="sub">${esc(m.tournament_name||'')} · ${esc(m.season_year)} · ${dt(m.start_datetime)} · run #${d.run}</p>
    <div class="grid3">
      <div class="panel" style="text-align:center">
        <div class="muted">Final score</div>
        <div class="scorebox">${m.home_score!=null?`${m.home_score} – ${m.away_score}`:'<span class="muted">not played</span>'}</div>
        <div class="muted">${esc(m.status_description||'')}</div>
      </div>
      <div class="panel"><h2 style="margin-top:0">Match result (1X2)</h2><canvas id="c1x2"></canvas></div>
      <div class="panel"><h2 style="margin-top:0">Most likely scorelines</h2><div id="scores"></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2 style="margin-top:0">Goal markets — model vs simulation</h2><div id="goals"></div></div>
      <div class="panel"><h2 style="margin-top:0">Team form (this match)</h2><div id="feat"></div></div>
    </div>
    <div class="panel"><h2 style="margin-top:0">Player props (top by expected volume)</h2><div id="props"></div></div>`;

  // 1x2 chart
  chart($('#c1x2'),{type:'bar',data:{labels:oneX2.map(p=>p.selection),
    datasets:[{label:'model',data:oneX2.map(p=>p.probability),backgroundColor:'#4f9cf9'},
      {label:'sim',data:oneX2.map(p=>simMap['1x2|'+p.selection+'|']),backgroundColor:'#27c499'}]},
    options:{...CO,scales:{x:GRID,y:{...GRID,max:1}}}});

  $('#scores').innerHTML = table(d.exact_scores,[
    {k:'selection',h:'Score'},{k:'probability',h:'Prob',num:true,render:v=>pct(v)}]);

  // goal markets table
  const goalsRows=[];
  (probMap['total_goals']||[]).forEach(p=>goalsRows.push({mkt:`O/U ${p.line}`,sel:p.selection,model:p.probability,sim:simMap['total_goals|'+p.selection+'|'+(p.line??'')]}));
  (probMap['btts']||[]).forEach(p=>goalsRows.push({mkt:'BTTS',sel:p.selection,model:p.probability,sim:simMap['btts|'+p.selection+'|']}));
  $('#goals').innerHTML = table(goalsRows,[
    {k:'mkt',h:'Market'},{k:'sel',h:'Sel'},
    {k:'model',h:'Model',num:true,render:v=>pct(v)},
    {k:'sim',h:'Sim',num:true,render:v=>pct(v)}]);

  $('#feat').innerHTML = table(d.features,[
    {k:'side',h:'Side',render:v=>`<span class="pill ${v==='home'?'home':'away'}">${esc(v)}</span>`},
    {k:'team_name',h:'Team'},{k:'xg',h:'xG',num:true},{k:'xg_against',h:'xGA',num:true},
    {k:'total_shots',h:'Shots',num:true,d:0},{k:'shots_on_target',h:'SoT',num:true,d:0},
    {k:'big_chances',h:'BigCh',num:true,d:0},{k:'possession_proxy',h:'Poss',num:true}]);

  $('#props').innerHTML = table(d.player_props,[
    {k:'player_name',h:'Player'},{k:'player_position',h:'Pos'},
    {k:'market_key',h:'Market',render:v=>esc(v.replace('player_',''))},
    {k:'line',h:'Line',num:true,d:1},
    {k:'simulated_mean',h:'Exp',num:true,render:v=>fmt(v,2)},
    {k:'simulated_probability',h:'P(over)',num:true,render:v=>pct(v)}]);
};

// =====================================================================
// TEAMS
// =====================================================================
ROUTES.teams = async (main)=>{
  const d = await API('/api/teams');
  main.innerHTML = `<h1>Teams</h1><p class="sub">Career averages from engineered team-match features. Click a team for detail.</p>
    <div class="panel" id="ttbl"></div>`;
  $('#ttbl').innerHTML = table(d.rows,[
    {k:'name',h:'Team',render:(v,r)=>`<a onclick="go('team/${r.id}')">${esc(v)}</a>`},
    {k:'matches',h:'Matches',num:true,d:0},
    {k:'gf',h:'GF',num:true},{k:'ga',h:'GA',num:true},
    {k:'xg',h:'xG',num:true},{k:'xga',h:'xGA',num:true},
    {k:'shots',h:'Shots',num:true,d:1}]);
};
ROUTES.team = async (main,[id])=>{
  killCharts();
  const d = await API('/api/team',{id});
  const t=d.team;
  main.innerHTML = `<a onclick="history.back()" class="muted">← back</a>
    <h1 style="margin-top:8px">${esc(t.name)}</h1><p class="sub">${esc(t.country_name||'')} · ${d.form.length} matches with features</p>
    <div class="panel"><h2 style="margin-top:0">Rolling xG for / against (per match, chronological)</h2><canvas id="cForm"></canvas></div>
    <div class="grid2">
      <div class="panel"><h2 style="margin-top:0">Per-season averages</h2><div id="tagg"></div></div>
      <div class="panel"><h2 style="margin-top:0">Goals scored vs conceded by season</h2><canvas id="cGoals"></canvas></div>
    </div>`;
  const roll=(arr,w=6)=>arr.map((_,i)=>{const s=arr.slice(Math.max(0,i-w+1),i+1);return s.reduce((a,b)=>a+(b||0),0)/s.length;});
  const xg=d.form.map(f=>+f.xg||0), xga=d.form.map(f=>+f.xg_against||0);
  chart($('#cForm'),{type:'line',data:{labels:d.form.map(f=>dt(f.match_date)),
    datasets:[{label:'xG (roll6)',data:roll(xg),borderColor:'#27c499',pointRadius:0,tension:.3},
      {label:'xGA (roll6)',data:roll(xga),borderColor:'#ef5b6b',pointRadius:0,tension:.3}]},
    options:{...CO,scales:{x:{...GRID,ticks:{color:'#8a97ad',maxTicksLimit:12}},y:GRID}}});
  $('#tagg').innerHTML = table(d.by_season,[
    {k:'season_year',h:'Season'},{k:'matches',h:'P',num:true,d:0},
    {k:'gf',h:'GF',num:true},{k:'ga',h:'GA',num:true},{k:'xg',h:'xG',num:true},{k:'xga',h:'xGA',num:true}]);
  chart($('#cGoals'),{type:'bar',data:{labels:d.by_season.map(r=>r.season_year),
    datasets:[{label:'GF',data:d.by_season.map(r=>r.gf),backgroundColor:'#4f9cf9'},
      {label:'GA',data:d.by_season.map(r=>r.ga),backgroundColor:'#ef5b6b'}]},options:CO});
};

// =====================================================================
// PLAYERS
// =====================================================================
ROUTES.players = async (main)=>{
  main.innerHTML = `<h1>Players</h1><p class="sub">Search the player pool, then jump to their simulated prop lines.</p>
    <div class="toolbar"><input id="pq" placeholder="Search player…" style="min-width:240px"/><button class="btn pri" id="pgo">Search</button></div>
    <div class="panel" id="ptbl"></div>`;
  const load=async()=>{
    $('#ptbl').innerHTML='<div class="loading">Loading…</div>';

const evColor = (ev)=> ev==null?'var(--mut)':(ev>0.02?'var(--good)':ev>=0?'var(--warn)':'var(--bad)');
ROUTES.upcoming = async (main)=>{
  main.innerHTML = `<h1>Upcoming & EV</h1>
    <p class="sub">Scrapes bet365 for upcoming fixtures + odds, scores them with the <b>final models (trained on all data)</b>, and ranks +EV bets. EV = model probability × decimal odds − 1.</p>
    <div class="toolbar">
      <button class="btn pri" id="urefresh">⟳ Scrape bet365 &amp; run models</button>
      <select id="umode"><option value="api">api mode (no browser)</option><option value="rendered">rendered (browser)</option></select>
      <span class="muted" id="ustatus"></span>
    </div>
    <div id="ustages"></div>
    <div id="ubody"><div class="loading">Loading cached result…</div></div>`;

  const stagePill = (s)=>{
    const col = s.status==='ok'?'var(--good)':s.status==='warn'?'var(--warn)':'var(--bad)';
    return `<span class="pill" style="background:#1c2433;color:${col};border:1px solid ${col}33">
      ${esc(s.stage)}: ${esc(s.status)}</span> <span class="muted" style="font-size:12px">${esc(s.detail||'')}</span>`;
  };
  const render = (d)=>{
    $('#ustatus').textContent = d.generated_at? 'updated '+new Date(d.generated_at).toLocaleString() : '';
    $('#ustages').innerHTML = (d.stages&&d.stages.length)
      ? `<div class="panel" style="padding:12px 16px">${d.stages.map(s=>`<div style="margin:3px 0">${stagePill(s)}</div>`).join('')}</div>`:'';
    if(d.message && (!d.matches || !d.matches.length)){
      $('#ubody').innerHTML = `<div class="panel" style="text-align:center;padding:48px">
        <div style="font-size:42px">📭</div><h2 style="margin:8px 0">${esc(d.message)}</h2>
        <p class="muted">When bet365 lists fixtures, they'll appear here with model probabilities and EV.</p></div>`;
      return;
    }
    if(!d.matches || !d.matches.length){ $('#ubody').innerHTML='<p class="muted">No fixtures.</p>'; return; }
    $('#ubody').innerHTML = d.matches.map(m=>{
      const mo=m.model;
      const modelLine = mo? `<div class="muted" style="margin:6px 0">
        1X2 <b>${pct(mo.p_home_win)}</b> / ${pct(mo.p_draw)} / <b>${pct(mo.p_away_win)}</b>
        · BTTS ${pct(mo.p_btts_yes)} · O2.5 ${pct(mo.p_over_2_5)}
        · λ ${fmt(mo.lambda_home,2)}–${fmt(mo.lambda_away,2)}</div>`:'';
      const sels = (m.selections||[]).map(s=>`
        <tr><td>${esc(s.market_key)}</td><td>${esc(s.selection)}</td>
          <td class="num">${s.line==null?'':s.line}</td>
          <td class="num">${fmt(s.decimal_odds,2)}</td>
          <td class="num">${s.model_probability==null?'<span class="muted">–</span>':pct(s.model_probability)}</td>
          <td class="num">${s.implied_probability==null?'':pct(s.implied_probability)}</td>
          <td class="num" style="color:${evColor(s.expected_value)};font-weight:700">
            ${s.expected_value==null?'–':(s.expected_value>=0?'+':'')+(s.expected_value*100).toFixed(1)+'%'}</td></tr>`).join('');
      const best = m.best_ev;
      const badge = best==null?'':`<span class="pill" style="background:${evColor(best)}22;color:${evColor(best)};border:1px solid ${evColor(best)}55">
        best EV ${(best>=0?'+':'')+(best*100).toFixed(1)}%</span>`;
      return `<div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <h2 style="margin:0">${esc(m.home)} vs ${esc(m.away)} ${badge}</h2>
          <span class="muted">${esc(m.competition||'')} ${m.start_time?'· '+new Date(m.start_time).toLocaleString():''}</span>
        </div>
        ${modelLine}
        ${sels? `<div class="tbl-wrap"><table><thead><tr>
            <th>Market</th><th>Sel</th><th class="num">Line</th><th class="num">Odds</th>
            <th class="num">Model</th><th class="num">Implied</th><th class="num">EV</th></tr></thead>
            <tbody>${sels}</tbody></table></div>`:''}
        ${(m.notes&&m.notes.length)? `<p class="muted" style="margin-top:8px">⚠ ${m.notes.map(esc).join(' · ')}</p>`:''}
      </div>`;
    }).join('');
  };

  // initial: cached
  try{ render(await API('/api/upcoming')); }catch(e){ $('#ubody').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  $('#urefresh').onclick=async()=>{
    $('#ustages').innerHTML=''; $('#ubody').innerHTML='<div class="loading">Scraping bet365 and scoring models… (may take a while)</div>';
    try{ render(await API('/api/upcoming',{refresh:1,mode:$('#umode').value})); }
    catch(e){ $('#ubody').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  };
};

    return table(rows.map(([k,v])=>({k,v})),[{k:'k',h:'Metric'},{k:'v',h:'Value',num:true,render:v=>fmt(v,4)}]);
  };
  $('#mdlist').innerHTML = d.models.map((m,i)=>`

      ${m.has_calibration?'<span class="tag">calibrated</span>':''}

// tiny markdown renderer (headings, lists, code, bold, links-as-text)
function miniMd(md){
  return md.split('\n').map(l=>{
    if(/^### /.test(l)) return '<h3>'+esc(l.slice(4))+'</h3>';
    if(/^## /.test(l)) return '<h2>'+esc(l.slice(3))+'</h2>';
    if(/^# /.test(l)) return '<h1>'+esc(l.slice(2))+'</h1>';
    if(/^- /.test(l)) return '<li>'+inlineMd(l.slice(2))+'</li>';
    if(/^\d+\. /.test(l)) return '<li>'+inlineMd(l.replace(/^\d+\. /,''))+'</li>';
    if(l.trim()==='') return '<br>';
    return '<p style="margin:4px 0">'+inlineMd(l)+'</p>';
  }).join('');
}
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g,(m,a,b)=>'<span class="chip">'+(b||a)+'</span>');
}
